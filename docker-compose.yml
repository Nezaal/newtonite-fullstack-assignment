# One command runs everything:  docker compose up --build
#   web    -> http://localhost:8080   (the app; nginx also forwards /api to the API)
#   api    -> http://localhost:4000   (REST API; runs migrations and seeds an empty database)
#   worker -> no port                 (turns saved jobs into notifications)
#   db     -> localhost:5432          (PostgreSQL)

x-backend-env: &backend-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (copy .env.example to .env first)}
  CORS_ORIGIN: http://localhost:${WEB_PORT:-8080}
  TRUST_PROXY: "1"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 90s

  worker:
    build: ./backend
    restart: unless-stopped
    command: ["npx", "tsx", "src/worker.ts"]
    environment:
      <<: *backend-env
    depends_on:
      api:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata:
